<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المحاضرات">
<title>المحاضرات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js"></script>
<style>
:root{--bg:#F7F7F5;--card:#fff;--ink:#1B1F2A;--mute:#5A606B;--line:#E4E4DF;--acc:#0F6B63;--soft:#E3F0EE;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101413;--card:#1A2020;--ink:#ECEFEE;--mute:#A3ACAA;--line:#2A3331;--acc:#4FB8AC;--soft:#1D3532;--on:#0B1412}}
:root[data-theme="dark"]{--bg:#101413;--card:#1A2020;--ink:#ECEFEE;--mute:#A3ACAA;--line:#2A3331;--acc:#4FB8AC;--soft:#1D3532;--on:#0B1412}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:20px 20px 12px}
h1{margin:0;font-size:30px}
.sub{margin:6px 0 0;font-size:14px;color:var(--mute)}
.search{display:block;margin-top:14px}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
#add{margin-top:10px;width:100%}
main{flex:1;overflow-y:auto;padding:0 20px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.main{flex:1;display:flex;align-items:center;gap:12px;padding:14px 0;border:0;background:none;color:inherit;font:inherit;text-align:start;min-width:0}
.main:disabled{cursor:default}
.num{width:44px;height:44px;flex:none;border-radius:12px;background:var(--soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.t{font-size:16px;font-weight:700}
.m{font-size:13px;color:var(--mute);margin-top:2px}
.ic{width:44px;height:44px;flex:none;border-radius:22px;border:1.5px solid var(--acc);background:var(--card);color:var(--acc);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ic.ok{background:var(--acc);color:var(--on);cursor:default}
.ic.plain{border-color:var(--line);color:var(--mute)}
.ring{transform:rotate(-90deg)}
.empty{padding:60px 0;text-align:center;color:var(--mute);font-size:16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;min-height:56px;border:0;background:none;font:inherit;font-size:14px;font-weight:700;color:var(--mute);cursor:pointer}
nav button[aria-current="page"]{color:var(--acc)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--acc);background:var(--card);color:var(--acc);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn.solid{background:var(--acc);color:var(--on)}
#rd{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#rd[hidden]{display:none}
.rh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.rh .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pg{flex:1;overflow:auto;padding:12px;text-align:center}
#pg canvas{display:block;margin:0 auto 12px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);max-width:100%}
#pm{padding:40px 0;color:var(--mute)}
#toast{position:fixed;inset-inline:20px;bottom:90px;margin:0 auto;max-width:360px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
#ed{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:7}#ed[hidden]{display:none}.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:24px 24px 0 0;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}.sheet h2{margin:0 0 4px;font-size:22px}.sheet label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute)}.sheet input[type="text"],.sheet input:not([type]){height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}.row2{display:flex;gap:10px}.row2 .btn{flex:1}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
<header>
<h1 id="h">المحاضرات</h1>
<p class="sub" id="sub"></p>
<label class="search" id="sw"><span style="position:absolute;left:-9999px">بحث</span><input id="q" type="search" placeholder="ابحث عن محاضرة" autocomplete="off"></label>
<button class="btn" id="add">إضافة محاضرة PDF من جهازك</button>
<input id="file" type="file" accept="application/pdf,.pdf" hidden>
</header>
<main><ul id="list"></ul><div class="empty" id="empty" hidden></div></main>
<nav><button id="t1" aria-current="page">المحاضرات</button><button id="t2">التنزيلات</button></nav>
</div>

<div id="rd" hidden role="dialog" aria-modal="true" aria-labelledby="rt">
<div class="rh"><button class="btn" id="rc">إغلاق</button><div class="t" id="rt"></div><button class="btn solid" id="rs" hidden>حفظ في الملفات</button></div>
<div id="pg"></div>
</div>
<div id="ed" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="et"><h2 id="et">تعديل المحاضرة</h2><label>العنوان<input id="e1" autocomplete="off"></label><label>اسم المحاضِر<input id="e2" autocomplete="off"></label><button class="btn" id="e3">استبدال ملف PDF</button><input id="file2" type="file" accept="application/pdf,.pdf" hidden><div class="row2"><button class="btn" id="e4">حذف المحاضرة</button><button class="btn solid" id="e5">حفظ</button></div><button class="btn" id="e6">إلغاء</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
var DEMO=[
{id:1,t:'المحاضرة الأولى: مقدمة',s:'اسم المحاضِر',d:'اسم المحاضِر · 3 صفحات',src:'demo'},
{id:2,t:'المحاضرة الثانية',s:'اسم المحاضِر',d:'اسم المحاضِر · 3 صفحات',src:'demo'},
{id:3,t:'المحاضرة الثالثة',s:'اسم المحاضِر',d:'اسم المحاضِر · 3 صفحات',src:'demo'},
{id:4,t:'المحاضرة الرابعة',s:'اسم المحاضِر',d:'اسم المحاضِر · 3 صفحات',src:'demo'}
];
var $=function(i){return document.getElementById(i)};
var L=[],db=null,mem={},got=new Set(),active={},tab=1,cur=null,dls=null;
var ICON_DL='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>';
var ICON_OK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
var ICON_TR='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
var ICON_ED='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var C=2*Math.PI*11;
if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js'}

/* التخزين على الجهاز */
function openDB(){return new Promise(function(r){try{var q=indexedDB.open('lectures-pdf',1);q.onupgradeneeded=function(){q.result.createObjectStore('f')};q.onsuccess=function(){r(q.result)};q.onerror=function(){r(null)}}catch(e){r(null)}})}
function tx(mode,fn){return new Promise(function(res,rej){var t=db.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=function(){res(q.result)};t.onerror=t.onabort=function(){rej(t.error)}})}
function put(k,b){mem[k]=b;if(!db)return Promise.resolve();return Promise.race([tx('readwrite',function(s){return s.put(b,k)}),sleep(4000)])}
function get(k){if(mem[k])return Promise.resolve(mem[k]);if(!db)return Promise.resolve(undefined);return Promise.race([tx('readonly',function(s){return s.get(k)}),sleep(4000)])}
function del(k){delete mem[k];if(!db)return Promise.resolve();return Promise.race([tx('readwrite',function(s){return s.delete(k)}),sleep(4000)])}
function keys(){if(!db)return Promise.resolve(Object.keys(mem).map(Number));return tx('readonly',function(s){return s.getAllKeys()})}
function loadMeta(){try{var s=localStorage.getItem('lecturesV2');if(s)return JSON.parse(s)}catch(e){}var u=[];try{u=JSON.parse(localStorage.getItem('userLectures')||'[]')}catch(e){}return DEMO.map(function(l){var o=Object.assign({},l);o.x='3 صفحات';delete o.d;return o}).concat(u.map(function(l){var o=Object.assign({},l);o.x=(l.d||'').replace('من جهازك · ','');delete o.d;return o}))}
function saveMeta(){try{localStorage.setItem('lecturesV2',JSON.stringify(L))}catch(e){}}

/* إنشاء ملف PDF تجريبي (3 صفحات) */
async function pageJpg(l,k){
var c=document.createElement('canvas');c.width=1190;c.height=1684;var x=c.getContext('2d');
x.fillStyle='#fff';x.fillRect(0,0,1190,1684);x.fillStyle='#0F6B63';x.fillRect(0,0,1190,24);
x.direction='rtl';x.textAlign='right';x.fillStyle='#1B1F2A';x.font='700 76px Tajawal,sans-serif';x.fillText(l.t,1090,260);
x.fillStyle='#5A606B';x.font='400 44px Tajawal,sans-serif';x.fillText(l.s,1090,340);x.fillText('الصفحة '+(k+1)+' من 3',1090,1560);
x.fillStyle='#1B1F2A';x.font='400 48px Tajawal,sans-serif';
['هذه صفحة تجريبية من ملف PDF.','أضف محاضراتك من جهازك لتظهر هنا.'].forEach(function(s,i){x.fillText(s,1090,520+i*90)});
var b=atob(c.toDataURL('image/jpeg',.85).split(',')[1]),a=new Uint8Array(b.length);
for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function mkPdf(jp){
var enc=new TextEncoder(),parts=[],off=[],len=0,n=jp.length,kids='';
function add(v){var b=typeof v==='string'?enc.encode(v):v;parts.push(b);len+=b.length}
function obj(i,head,st){off[i]=len;add(i+' 0 obj\n'+head+'\n');if(st){add('stream\n');add(st);add('\nendstream\n')}add('endobj\n')}
for(var k=0;k<n;k++)kids+=(3+3*k)+' 0 R ';
add('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids ['+kids+'] /Count '+n+' >>');
var cs='q 595 0 0 842 0 0 cm /Im Do Q';
for(k=0;k<n;k++){
obj(3+3*k,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im '+(4+3*k)+' 0 R >> >> /Contents '+(5+3*k)+' 0 R >>');
obj(4+3*k,'<< /Type /XObject /Subtype /Image /Width 1190 /Height 1684 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jp[k].length+' >>',jp[k]);
obj(5+3*k,'<< /Length '+cs.length+' >>',cs)}
var xr=len,tot=3+3*n;add('xref\n0 '+tot+'\n0000000000 65535 f \n');
for(var i=1;i<tot;i++)add(('0000000000'+off[i]).slice(-10)+' 00000 n \n');
add('trailer\n<< /Size '+tot+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
return new Blob(parts,{type:'application/pdf'})}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function toast(t){var e=$('toast');e.textContent=t;e.className='on';clearTimeout(toast.h);toast.h=setTimeout(function(){e.className=''},3400)}
function byId(id){return L.filter(function(x){return x.id===id})[0]}

/* التنزيل */
async function startDl(l){
if(active[l.id]||got.has(l.id))return;
var a=active[l.id]={p:0,stop:false};render();
try{
try{await document.fonts.load('700 40px Tajawal','محاضرة')}catch(e){}
var blob,jp=[];
for(var i=1;i<=10;i++){await sleep(120);if(a.stop)throw 0;a.p=i/10;paint();if(i===3||i===5||i===7)jp.push(await pageJpg(l,jp.length))}
blob=mkPdf(jp);
await put(l.id,blob);got.add(l.id);
}catch(e){if(!a.stop)toast('تعذّر التنزيل، حاول مرة أخرى')}
delete active[l.id];render();
}
function stopDl(id){if(active[id])active[id].stop=true}
function paint(){for(var id in active){var c=document.querySelector('[data-ring="'+id+'"]');if(c)c.setAttribute('stroke-dashoffset',C*(1-active[id].p))}}

/* العرض */
function ctl(l){
if(got.has(l.id)){
return tab===2?'<button class="ic plain" data-act="del" data-id="'+l.id+'" aria-label="حذف التنزيل">'+ICON_TR+'</button>':'<span class="ic ok" role="img" aria-label="محمّلة">'+ICON_OK+'</span>';}
if(active[l.id]){
return '<button class="ic" data-act="stop" data-id="'+l.id+'" aria-label="إيقاف التنزيل"><svg class="ring" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="3"/><circle data-ring="'+l.id+'" cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-active[l.id].p)+'"/></svg></button>';}
return '<button class="ic" data-act="dl" data-id="'+l.id+'" aria-label="تنزيل">'+ICON_DL+'</button>';}
function render(){
var q=$('q').value.trim(),items=L.filter(function(l){return tab===1?(!q||l.t.indexOf(q)>-1||l.s.indexOf(q)>-1):got.has(l.id)});
$('list').innerHTML=items.map(function(l,i){
return '<li><button class="main" data-act="open" data-id="'+l.id+'"'+(got.has(l.id)?'':' disabled')+'><span class="num">PDF</span><span><div class="t">'+esc(l.t)+'</div><div class="m">'+esc(l.s+' · '+l.x)+'</div></span></button>'+ctl(l)+(tab===1?'<button class="ic plain" data-act="edit" data-id="'+l.id+'" aria-label="تعديل">'+ICON_ED+'</button>':'')+'</li>';}).join('');
$('empty').hidden=items.length>0;
$('empty').textContent=tab===1?(L.length?'لا توجد نتائج':'لا توجد محاضرات بعد، أضف ملف PDF من جهازك'):'لا توجد محاضرات محمّلة بعد';
$('h').textContent=tab===1?'المحاضرات':'التنزيلات';
$('sub').textContent=tab===1?'محاضرات بصيغة PDF، حمّلها لتقرأها بدون إنترنت':'متاحة بدون إنترنت';
$('sw').hidden=$('add').hidden=tab!==1;
$('t1').setAttribute('aria-current',tab===1?'page':'false');
$('t2').setAttribute('aria-current',tab===2?'page':'false');
$('t2').textContent='التنزيلات ('+got.size+')';
}

/* القارئ */
async function openPdf(id){
var l=byId(id),b;try{b=await get(id)}catch(e){}
if(!l||!b){toast('تعذّر فتح المحاضرة');return}
cur={id:id,blob:b,l:l};$('rt').textContent=l.t;$('pg').innerHTML='<div id="pm">جارٍ فتح الملف…</div>';
$('rs').hidden=!dls;$('rd').hidden=false;$('rc').focus();
if(!window.pdfjsLib){$('pm').textContent='تعذّر عرض الملف هنا، يمكنك حفظه في الملفات وفتحه.';return}
try{
var pdf=await pdfjsLib.getDocument({data:await b.arrayBuffer()}).promise,w=$('pg').clientWidth-24,dpr=Math.min(window.devicePixelRatio||1,2);
$('pg').innerHTML='';
for(var i=1;i<=pdf.numPages;i++){
if(!cur||cur.id!==id)return;
var p=await pdf.getPage(i),sc=w/p.getViewport({scale:1}).width,vp=p.getViewport({scale:sc*dpr}),c=document.createElement('canvas');
c.width=vp.width;c.height=vp.height;c.style.width=(vp.width/dpr)+'px';c.setAttribute('role','img');c.setAttribute('aria-label','الصفحة '+i+' من '+pdf.numPages);
$('pg').appendChild(c);await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}
}catch(e){if(cur&&cur.id===id){$('pg').innerHTML='<div id="pm">تعذّر عرض الملف هنا، يمكنك حفظه في الملفات وفتحه.</div>'}}
}
function closePdf(){cur=null;$('rd').hidden=true;$('pg').innerHTML=''}
async function removeDl(id){var l=byId(id);try{await del(id)}catch(e){}got.delete(id);if(l&&l.u){L=L.filter(function(x){return x.id!==id});saveMeta()}render()}

$('list').addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
var id=+b.dataset.id,l=byId(id),a=b.dataset.act;
if(a==='dl')startDl(l);else if(a==='stop')stopDl(id);else if(a==='del')removeDl(id);else if(a==='open')openPdf(id);else if(a==='edit')openEdit(id);
});
$('t1').onclick=function(){tab=1;render()};
$('t2').onclick=function(){tab=2;render()};
$('q').addEventListener('input',render);
$('rc').onclick=closePdf;
$('rs').onclick=async function(){if(!cur||!dls)return;try{await dls.save({filename:cur.l.t+'.pdf',data:cur.blob})}catch(e){if(!e||e.code!=='declined')toast('تعذّر حفظ الملف')}};
$('add').onclick=function(){$('file').click()};
$('file').onchange=async function(){
var f=this.files[0];this.value='';if(!f)return;
var id=Date.now(),l={id:id,t:f.name.replace(/\.pdf$/i,''),s:'من جهازك',x:(f.size/1048576).toFixed(1)+' م.ب',u:1};
try{await put(id,f.slice(0,f.size,'application/pdf'));L.push(l);got.add(id);saveMeta();tab=1;render();toast('أُضيفت المحاضرة')}catch(e){toast('تعذّر حفظ الملف على الجهاز')}};
var ed=null,delArm=false;
function openEdit(id){var l=byId(id);if(!l)return;ed=id;delArm=false;$('e1').value=l.t;$('e2').value=l.s;$('e4').textContent='حذف المحاضرة';$('ed').hidden=false;$('e1').focus()}
function closeEdit(){ed=null;$('ed').hidden=true}
$('e6').onclick=closeEdit;
$('e5').onclick=function(){var l=byId(ed);if(!l)return;l.t=$('e1').value.trim()||l.t;l.s=$('e2').value.trim()||l.s;saveMeta();closeEdit();render()};
$('e4').onclick=async function(){if(!delArm){delArm=true;this.textContent='تأكيد الحذف النهائي';return}var id=ed;closeEdit();try{await del(id)}catch(e){}got.delete(id);L=L.filter(function(x){return x.id!==id});saveMeta();render();toast('حُذفت المحاضرة')};
$('e3').onclick=function(){$('file2').click()};
$('file2').onchange=async function(){var f=this.files[0];this.value='';var l=byId(ed);if(!f||!l)return;try{await put(l.id,f.slice(0,f.size,'application/pdf'));got.add(l.id);l.x=(f.size/1048576).toFixed(1)+' م.ب';l.u=1;delete l.src;saveMeta();closeEdit();render();toast('تم استبدال الملف')}catch(e){toast('تعذّر حفظ الملف على الجهاز')}};
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(!$('ed').hidden)closeEdit();else if(!$('rd').hidden)closePdf()});

(async function(){
L=loadMeta();
render();
db=await Promise.race([openDB(),sleep(3000).then(function(){return null})]);
try{(await Promise.race([keys(),sleep(3000).then(function(){return[]})])).forEach(function(k){got.add(k)})}catch(e){}
L=L.filter(function(l){return !l.u||got.has(l.id)});
render();
if(window.claude&&claude.use){claude.use('downloads').then(function(d){dls=d;if(cur)$('rs').hidden=!d}).catch(function(){})}
})();
</script>
</body>
</html>
