<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#17202a;--mute:#5d6b7a;--line:#d9e0e8;--acc:#0b6e6e;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10171e;--card:#18222b;--ink:#e8edf2;--mute:#9aa8b6;--line:#2a3743;--acc:#4fc1b8;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "IBM Plex Sans Arabic",Tahoma,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:10px 0 20px}h2{font-size:20px;margin:0 0 12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:20px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,textarea{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:var(--card);padding:8px 18px;border-radius:6px;margin-top:14px}
button.ghost{background:transparent;color:var(--acc)}
button.sm{padding:2px 10px;margin:0;font-size:14px}
button.del{border-color:var(--bad);color:var(--bad);background:transparent}
.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.item b{flex:1}
#msg{position:sticky;bottom:10px;padding:10px 16px;border-radius:6px;background:var(--ink);color:var(--bg);display:none}
.hint{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
<h1>لوحة التحكم بالمحاضرات</h1>

<section class="box" id="login">
<h2>الاتصال بالمستودع</h2>
<div class="row">
<div><label for="repo">المستودع</label><input id="repo" value="josefkadder-art/josefkadder-art.github.io" dir="ltr"></div>
<div><label for="branch">الفرع</label><input id="branch" value="main" dir="ltr"></div>
</div>
<label for="token">رمز الوصول (Token)</label>
<input id="token" type="password" dir="ltr" autocomplete="off" placeholder="github_pat_...">
<p class="hint">يُحفظ الرمز في متصفحك فقط ولا يُرسل إلا إلى GitHub. أنشئ رمزاً بصلاحية Contents: Read and write لهذا المستودع فقط.</p>
<button id="connect">اتصال وتحميل المحاضرات</button>
</section>

<section class="box" id="editor" hidden>
<h2 id="ftitle">إضافة محاضرة</h2>
<label for="t">عنوان المحاضرة</label><input id="t">
<label for="d">الوصف</label><textarea id="d"></textarea>
<div class="row">
<div><label for="dt">التاريخ</label><input id="dt" type="date"></div>
<div><label for="file">رفع ملف (PDF أو شرائح)</label><input id="file" type="file"></div>
</div>
<label for="ln">روابط (كل رابط في سطر بصيغة: النص | الرابط)</label>
<textarea id="ln" dir="ltr" placeholder="الفيديو | https://youtube.com/..."></textarea>
<button id="save">حفظ المحاضرة</button>
<button class="ghost" id="cancel" hidden>إلغاء التعديل</button>
</section>

<section class="box" id="all" hidden>
<h2>المحاضرات الحالية</h2>
<div id="items"></div>
</section>
</div>
<div id="msg" role="status"></div>

<script>
const $=id=>document.getElementById(id);
let list=[],sha=null,editing=null;
$('repo').value=localStorage.getItem('repo')||$('repo').value;
$('token').value=localStorage.getItem('tok')||'';

function say(t,bad){const m=$('msg');m.textContent=t;m.style.background=bad?'var(--bad)':'var(--ink)';m.style.display='block';clearTimeout(say.h);say.h=setTimeout(()=>m.style.display='none',5000)}
function api(path,opt={}){
  return fetch(`https://api.github.com/repos/${$('repo').value.trim()}/contents/${path}`,{...opt,headers:{Authorization:'Bearer '+$('token').value.trim(),Accept:'application/vnd.github+json',...(opt.headers||{})}});
}
const b64text=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const fileB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});

async function load(){
  const r=await api('lectures.json?ref='+encodeURIComponent($('branch').value.trim()));
  if(r.status===404){list=[];sha=null}
  else if(!r.ok){throw new Error(r.status===401?'الرمز غير صحيح':'تعذّر الاتصال ('+r.status+')')}
  else{const j=await r.json();sha=j.sha;list=JSON.parse(unb64(j.content))}
  render();
}
async function push(){
  const body={message:'تحديث المحاضرات',content:b64text(JSON.stringify(list,null,2)),branch:$('branch').value.trim()};
  if(sha)body.sha=sha;
  const r=await api('lectures.json',{method:'PUT',body:JSON.stringify(body)});
  if(!r.ok)throw new Error('فشل الحفظ ('+r.status+')');
  sha=(await r.json()).content.sha;
}
function render(){
  $('editor').hidden=$('all').hidden=false;
  $('items').innerHTML=list.length?'':'<p class="hint">لا توجد محاضرات بعد.</p>';
  list.forEach((l,i)=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML='<b></b>';d.firstChild.textContent=l.title;
    [['▲',()=>move(i,-1),'أعلى'],['▼',()=>move(i,1),'أسفل'],['تعديل',()=>edit(i)],['حذف',()=>del(i),'','del']].forEach(([t,f,a,c])=>{
      const b=document.createElement('button');b.textContent=t;b.className='sm ghost '+(c||'');if(a)b.ariaLabel=a;b.onclick=f;d.append(b)});
    $('items').append(d);
  });
}
async function commit(ok){try{await push();render();say(ok)}catch(e){say(e.message,1)}}
function move(i,k){const j=i+k;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];commit('تم تغيير الترتيب')}
function del(i){if(confirm('حذف «'+list[i].title+'»؟')){list.splice(i,1);commit('تم الحذف')}}
function edit(i){const l=list[i];editing=i;$('t').value=l.title;$('d').value=l.description;$('dt').value=l.date||'';
  $('ln').value=(l.links||[]).map(k=>k.label+' | '+k.url).join('\n');$('ftitle').textContent='تعديل محاضرة';$('cancel').hidden=false;$('t').focus()}
function reset(){editing=null;['t','d','dt','ln','file'].forEach(i=>$(i).value='');$('ftitle').textContent='إضافة محاضرة';$('cancel').hidden=true}
$('cancel').onclick=reset;

$('connect').onclick=async()=>{
  localStorage.setItem('repo',$('repo').value);localStorage.setItem('tok',$('token').value);
  try{await load();say('تم الاتصال')}catch(e){say(e.message,1)}
};
$('save').onclick=async()=>{
  const title=$('t').value.trim();if(!title)return say('أدخل عنوان المحاضرة',1);
  const links=$('ln').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const p=s.split('|');return p.length>1?{label:p[0].trim(),url:p.slice(1).join('|').trim()}:{label:'فتح',url:s}});
  $('save').disabled=true;
  try{
    const f=$('file').files[0];
    if(f){
      const ext=(f.name.match(/\.[A-Za-z0-9]+$/)||[''])[0];
      const name='lectures/'+Date.now()+ext;
      const r=await api(name,{method:'PUT',body:JSON.stringify({message:'رفع ملف',content:await fileB64(f),branch:$('branch').value.trim()})});
      if(!r.ok)throw new Error('فشل رفع الملف ('+r.status+')');
      links.unshift({label:'تحميل الملف',url:name});
    }
    const item={id:editing!==null?list[editing].id:String(Date.now()),title,description:$('d').value.trim(),date:$('dt').value,links};
    if(editing!==null)list[editing]=item;else list.push(item);
    await push();reset();render();say('تم الحفظ، سيظهر في الموقع خلال دقيقة تقريباً');
  }catch(e){say(e.message,1)}
  $('save').disabled=false;
};
if($('token').value)$('connect').click();
</script>
</body>
</html>
